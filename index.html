<script>
window.addEventListener('error',e=>{const a=document.getElementById('app');if(a&&!a.innerHTML.trim())a.innerHTML='<div class="card">⚠️ 오류가 났어요<br><small>'+String(e.message).replace(/</g,'&lt;')+'</small><br>config.js가 같이 올라가 있는지, Firebase 값이 채워져 있는지 확인해 주세요.</div>'});
firebase.initializeApp(FB);const db=firebase.database();const R=p=>db.ref(p);
const $=s=>document.querySelector(s),v=id=>document.getElementById(id).value,
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
ui=h=>{$('#app').innerHTML=h},card=h=>'<div class="card">'+h+'</div>',
P=['ready','pledge','draft','assigned','active','ended','revealed','reflect','done'],
PL=['준비','서약','배정 초안','마니또 공개됨','활동 중','종료·추측','정체 공개됨','소감','완료'],
CH='<svg class="chick" viewBox="0 0 100 100" width="80"><ellipse cx="50" cy="58" rx="34" ry="32" fill="#FFE066"/><circle cx="38" cy="52" r="4" fill="#5a3b12"/><circle cx="62" cy="52" r="4" fill="#5a3b12"/><path d="M45 60l5 6 5-6z" fill="#FF9A5A"/><circle cx="30" cy="62" r="5" fill="#FFB8A8" opacity=".7"/><circle cx="70" cy="62" r="5" fill="#FFB8A8" opacity=".7"/><path d="M50 26q-4-10 4-12M46 27q-8-8-2-14" stroke="#FFD24A" stroke-width="4" fill="none" stroke-linecap="round"/></svg>';
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function spark(n=30){for(let i=0;i<n;i++){const s=document.createElement('span');s.className='sp';s.textContent=['⭐','✨','🌟','💛','🌸'][i%5];s.style.left=Math.random()*100+'vw';s.style.animationDuration=2+Math.random()*2+'s';s.style.fontSize=14+Math.random()*18+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),4500)}}
function curtain(d){const e=document.createElement('div');e.className='cur';e.innerHTML='<i class="l"></i><i class="r"></i><div class="ct">🌟 Day '+d+'<br>미션이 열렸어요!</div>';document.body.appendChild(e);spark(40);setTimeout(()=>e.classList.add('open'),1400);setTimeout(()=>e.remove(),3200)}
window.onhashchange=()=>location.reload();

/* ================= 학생 ================= */
let S={},T={},me=localStorage.mid||null;
const MINM=typeof MIN_MISSION!='undefined'?MIN_MISSION:10,MAXM=typeof MAX_MISSION!='undefined'?MAX_MISSION:300,MINR=typeof MIN_REFL!='undefined'?MIN_REFL:30,MAXR=typeof MAX_REFL!='undefined'?MAX_REFL:1000,
cn=(e,a,b)=>{e.nextElementSibling.textContent=e.value.trim().length+'자'};
function watch(k,p){R(p).on('value',s=>{S[k]=s.val()??(k=='cfg'?{}:null);render()},e=>ui(card('⚠️ 데이터베이스에 연결하지 못했어요<br><small>'+esc(e.message)+'</small><br>Firebase 규칙이 열려 있는지 확인해 주세요.')))}
function sInit(){watch('dlv','deliver');watch('cfg','config');watch('days','days');watch('ros','roster');if(me)bind();render()}
function bind(){['tgt:assign/','subs:sub/','inbox:inbox/','guess:guess/','refl:reflect/','sig:sig/','hrtMine:hearts/','unl:unlock/'].forEach(x=>{const[k,p]=x.split(':');watch(k,p+me)})}
const K=x=>x+me+(S.cfg.run||''),tab=t=>{if(t!='inbox')S.nw=[];S.tab=t;render()},logout=()=>{localStorage.removeItem('mid');location.reload()};
function view(n,h){document.body.classList.toggle('oath',!!S.dark);if(n=='pledge'&&S.view=='pledge'&&$('#cv'))return;S.view=n;ui(h);if(n=='pledge')initCv()}
function render(){
 S.dark=false;const c=S.cfg,dy=S.days;
 if(c===undefined||dy===undefined){if(!$('#app').innerHTML.trim())ui(card('<div style="text-align:center">'+CH+'<p>연결 중이에요…</p></div>'));return}
 const ph=c.phase||'ready',pi=P.indexOf(ph);

 card('<h3 class="tgl" onclick="SP.so=!SP.so;arender(1)">✍️ 서명 모음 <small>'+(SP.so?'▲':'▼')+'</small></h3>'+(!SP.so?'':'<div style="margin-top:18px">'+pt.map(([i,u])=>(A.sig||{})[i]?'<div style="display:inline-block;text-align:center"><img src="'+A.sig[i]+'" width="240"><br>'+esc(u.name)+'</div>':'').join('')+'</div>'))}
function pStat(){const pt=part(),g=A.guess||{},as=A.assign||{},hr=A.hearts||{},ang={};Object.keys(as).forEach(w=>ang[as[w]]=w);
 const tally=a=>{const c={};a.forEach(x=>{if(x!=null)c[x]=(c[x]||0)+1});return Object.entries(c).sort((x,y)=>y[1]-x[1])},
 bars=(L,u)=>{if(!L.length)return'<p>아직 데이터가 없어요</p>';const m=L[0][1];return L.slice(0,10).map(([i,n])=>'<div class="rk"><span class="rn">'+esc(nm(i))+'</span><span class="rb"><i style="width:'+Math.round(n/m*100)+'%"></i></span><span class="rc">'+n+u+'</span></div>').join('')},
 gs=Object.keys(g),ok=gs.filter(i=>ang[i]&&ang[i]==g[i]),hk=Object.values(hr).reduce((a,o)=>a+Object.keys(o).length,0),
 recv=tally(Object.entries(hr).flatMap(([r2,o])=>Object.keys(o).map(()=>ang[r2]))),gave=Object.entries(hr).map(([r2,o])=>[r2,Object.keys(o).length]).sort((x,y)=>y[1]-x[1]);
 let h=card('<h3>🎭 수호천사로 가장 많이 추측된 친구</h3>'+bars(tally(Object.values(g)),'표'))+
 card('<h3>🎯 추측 정답 현황</h3>'+(gs.length?'<p>제출 '+gs.length+'명 중 <b>'+ok.length+'명</b> 정답 ('+Math.round(ok.length/gs.length*100)+'%)</p><p><span class="tag" style="background:#DDF3D6">정답</span> '+(ok.length?ok.map(i=>esc(nm(i))).join(', '):'없음')+'</p>':'<p>아직 추측이 없어요</p>'));
 const cls={a:[],b:[],c:[],d:[],n:[]};pt.forEach(([i,u])=>{const t2=as[i];if(!t2)return;if(!g[i]){cls.n.push(u.name);return}const ex=g[t2]==i,ok2=g[i]==ang[i];(ex?(ok2?cls.c:cls.d):(ok2?cls.a:cls.b)).push(u.name)});
 const cl=(t,L,bg)=>'<div class="grp"><span class="tag" style="background:'+bg+'">'+t+' · '+L.length+'명</span><br>'+(L.length?L.map(esc).join(', '):'<small>없음</small>')+'</div>';
 h+=card('<h3>🕵️ 정체 노출 · 정답 분류</h3><p><small>정체 들킴 = 내 마니또가 나를 수호천사로 골랐어요 / 맞춤 = 내가 내 수호천사를 정확히 골랐어요 (추측을 안 낸 학생은 따로 표시)</small></p>'+cl('정체 안 들킴 · 수호천사 맞춤',cls.a,'#DDF3D6')+cl('정체 안 들킴 · 수호천사 못 맞춤',cls.b,'#FFF1BD')+cl('정체 들킴 · 수호천사 맞춤',cls.c,'#DDEBFF')+cl('정체 들킴 · 수호천사 못 맞춤',cls.d,'#FFDCCF')+(cls.n.length?cl('추측 미제출',cls.n,'#EEE'):''));
 const mk=new Set();for(let d=1;d<=(cf().nDays||0);d++)Object.keys((A.days||{})[d]||{}).forEach(m=>mk.add(d+'~'+m));
 const sc={};pt.forEach(([i,u])=>{const n=Object.keys((A.sub||{})[i]||{}).filter(k=>mk.has(k)).length;(sc[n]=sc[n]||[]).push(u.name)});
 h+=card('<h3>📒 스탬프 개수별 명단 <small>(전체 미션 '+mk.size+'개)</small></h3>'+(Object.keys(sc).sort((a,b)=>b-a).map(n=>'<div class="grp"><span class="tag">'+n+'개 · '+sc[n].length+'명</span><br>'+sc[n].map(esc).join(', ')+'</div>').join('')||'<p>참여 학생이 없어요</p>'));
 const rows=[];for(let d=1;d<=(cf().nDays||0);d++)Object.entries((A.days||{})[d]||{}).forEach(([mid,m])=>{const n=pt.filter(([i])=>((A.sub||{})[i]||{})[d+'~'+mid]).length;rows.push('<div class="rk"><span class="rn">D'+d+' '+esc(m.title)+'</span><span class="rb"><i style="width:'+(pt.length?Math.round(n/pt.length*100):0)+'%"></i></span><span class="rc">'+n+'/'+pt.length+'</span></div>')});
 return h+card('<h3>📝 미션별 제출률</h3>'+(rows.join('')||'<p>미션이 없어요</p>'))}
function deliv(k,on){if(!confirm(on?'이 미션의 제출물을 마니또들에게 전달할까요?\n(전달 후 새로 제출하는 글은 바로 도착해요)':'전달을 취소할까요? 학생들의 우편함에서 다시 사라져요.'))return;R('deliver/'+k).set(on?Date.now():null)}
function csv(){const pt=part(),n=cf().nDays||0,cols=[];
 for(let d=1;d<=n;d++)Object.entries((A.days||{})[d]||{}).forEach(([mid,m])=>cols.push([d,mid,m]));
 const rows=[['학번','이름','추측','소감',...cols.map(([d,,m])=>'Day'+d+' '+(m.req?'필수':'선택')+' '+m.title)]];
 pt.forEach(([i,u])=>{const g=(A.guess||{})[i];rows.push([i,u.name,g?nm(g):'',(A.reflect||{})[i]||'',...cols.map(([d,mid])=>{const s=((A.sub||{})[i]||{})[d+'~'+mid];return s?s.t:''})])});
 const t='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='manito.csv';a.click()}
function resetAll(){if(!confirm('배정·제출물·힌트·추측·소감·서약을 모두 초기화할까요?\n(명단과 미션은 유지돼요)'))return;
 const u={};['assign','draft','sub','inbox','hearts','guess','reflect','sig','deliver','unlock','flip'].forEach(k=>u[k]=null);
 Object.keys(A.roster||{}).forEach(i=>u['roster/'+i+'/pledged']=false);
 u['config/phase']='ready';u['config/day']=0;u['config/run']=Date.now();db.ref().update(u).then(()=>toast('초기화했어요'))}
location.hash=='#admin'?aInit():sInit();
</script></body></html>
